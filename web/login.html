
<form id="authForm" novalidate>
    <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input
            class="form-control"
            id="email"
            type="email"
            autocomplete="email"
            required
        >
    </div>

    <div class="mb-2">
        <label class="form-label" for="password">Password</label>
        <input
            class="form-control"
            id="password"
            type="password"
            autocomplete="current-password"
            required
        >
    </div>

    <div class="text-end mb-3">
        <a href="forgot-password.html" class="small text-success">
            Forgot Password?
        </a>
    </div>

    <button class="btn btn-success w-100" type="submit">
        Log in
    </button>
</form>

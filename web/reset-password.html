
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CropGuard AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            font-family: Arial, sans-serif;
        }
        .reset-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,.10);
        }
        .brand {
            color: #198754;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="reset-card">
    <h2 class="brand text-center mb-2">🌱 CropGuard AI</h2>
    <h4 class="text-center mb-2">Create New Password</h4>

    <p class="text-muted text-center mb-4">
        Enter your new password below.
    </p>

    <form id="resetForm">
        <label for="password" class="form-label">New Password</label>
        <input
            type="password"
            id="password"
            class="form-control mb-3"
            placeholder="At least 8 characters"
            minlength="8"
            maxlength="128"
            required
        >

        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            class="form-control mb-3"
            placeholder="Enter password again"
            minlength="8"
            maxlength="128"
            required
        >

        <button type="submit" id="submitBtn" class="btn btn-success w-100">
            Reset Password
        </button>
    </form>

    <div id="message" class="mt-3 text-center" role="status"></div>

    <div class="text-center mt-4">
        <a href="login.html" class="text-success text-decoration-none">
            Back to Login
        </a>
    </div>
</div>

<script>
const API_BASE = "https://cropguard-ai-0a6n.onrender.com/api";

const params = new URLSearchParams(window.location.search);
const resetToken = params.get("token");

const form = document.getElementById("resetForm");
const message = document.getElementById("message");
const button = document.getElementById("submitBtn");

if (!resetToken) {
    message.className = "mt-3 text-center text-danger";
    message.textContent = "Invalid reset link. Please request a new one.";
    button.disabled = true;
}

form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        message.className = "mt-3 text-center text-danger";
        message.textContent = "Passwords do not match.";
        return;
    }

    button.disabled = true;
    button.textContent = "Updating...";
    message.textContent = "";

    try {
        const response = await fetch(`${API_BASE}/auth/reset-password`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                token: resetToken,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Password reset failed.");
        }

        message.className = "mt-3 text-center text-success";
        message.textContent = data.message;

        form.reset();
        button.disabled = true;

    } catch (error) {
        message.className = "mt-3 text-center text-danger";
        message.textContent = error.message;

        button.disabled = false;
        button.textContent = "Reset Password";
    }
});
</script>

</body>
</html>

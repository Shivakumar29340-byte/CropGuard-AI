
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CropGuard AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            font-family: Arial, sans-serif;
        }
        .reset-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,.10);
        }
        .brand {
            color: #198754;
            font-weight: bold;
        }
        .btn-success {
            background: #198754;
            border: none;
        }
    </style>
</head>
<body>

<div class="reset-card">
    <h2 class="brand text-center mb-2">🌱 CropGuard AI</h2>
    <h4 class="text-center mb-2">Forgot Password?</h4>

    <p class="text-muted text-center mb-4">
        Enter your registered email address. We'll send you a password-reset link.
    </p>

    <form id="forgotForm">
        <label for="email" class="form-label">Email Address</label>

        <input
            type="email"
            id="email"
            class="form-control mb-3"
            placeholder="Enter your registered email"
            required
        >

        <button type="submit" id="submitBtn" class="btn btn-success w-100">
            Send Reset Link
        </button>
    </form>

    <div id="message" class="mt-3 text-center" role="status"></div>

    <div class="text-center mt-4">
        <a href="login.html" class="text-success text-decoration-none">
            ← Back to Login
        </a>
    </div>
</div>

<script>
const API_BASE = "https://cropguard-ai-0a6n.onrender.com/api";

document.getElementById("forgotForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message");
    const button = document.getElementById("submitBtn");

    button.disabled = true;
    button.textContent = "Sending...";
    message.className = "mt-3 text-center text-muted";
    message.textContent = "";

    try {
        const response = await fetch(`${API_BASE}/auth/forgot-password`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Unable to process request.");
        }

        message.className = "mt-3 text-center text-success";
        message.textContent = data.message;

    } catch (error) {
        message.className = "mt-3 text-center text-danger";
        message.textContent = error.message || "Connection failed. Try again.";

    } finally {
        button.disabled = false;
        button.textContent = "Send Reset Link";
    }
});
</script>

</body>
</html>
